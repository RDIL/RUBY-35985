group = rocks.rdil
version = 0.2.0

pluginRepositoryUrl = https://github.com/rdil/ruby-analysis-probe

# Pinned tight on purpose: this plugin instruments private RubyMine internals by name, and a platform
# upgrade can move them.
pluginSinceBuild = 262
pluginUntilBuild = 262.*

# The plugin compiles against RubyMine's own jars (including the bundled Ruby plugin), which are not
# redistributable. Leave this unset to auto-detect a local RubyMine.app, or point it at one:
#   ./gradlew build -PplatformLocalPath=/Applications/RubyMine.app
# platformLocalPath =

# Opt out of bundling a Kotlin stdlib -> https://jb.gg/intellij-platform-kotlin-stdlib
# (nothing here is Kotlin, but the flag keeps the platform from assuming otherwise)
kotlin.stdlib.default.dependency = false

# https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true
# https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true
